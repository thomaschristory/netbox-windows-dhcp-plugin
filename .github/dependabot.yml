version: 2

updates:
  # Keeps the SHA-pinned actions in .github/workflows current: a PR bumps the SHA and the
  # trailing `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after an action release before proposing it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: ci

  # Python dependencies in uv.lock (dev tools and the pinned versions CI installs).
  - package-ecosystem: uv
    directory: /
    # Keep the minimum versions in pyproject.toml where they are while the range still allows the new release, so
    # users are not forced onto newer libraries for nothing (by default Dependabot raised paramiko>=3.5). uv.lock
    # still moves, so CI tests the latest versions.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
