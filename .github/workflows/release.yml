name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # main requires the CI checks before a merge, but an admin can bypass them (admin merge or direct push) and a
  # tag can point at any commit on main, so the cheap checks run again here and publishing waits for them. The
  # Python matrix and the NetBox tiers stay in ci.yml.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # pwsh is preinstalled on the runner, so the script tests against stub cmdlets run too.
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history of all branches, for the check that a tag points at a commit on main.
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Same target as CI: the build backend and twine come from uv.lock, checked by hash.
      - run: make dist
      - name: Check that the version matches the tag
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 dev/scripts/check_dist.py dist --tag "$REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # A run started by hand stops here: it rehearses the checks and the build, and publishes nothing.
  publish-pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/netbox-windows-dhcp-plugin
    permissions:
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
