name: 🐞 Bug report
description: The plugin behaves incorrectly, syncs wrong data, or errors.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Versions and exact steps make most issues reproducible.

        > [!WARNING]
        > **Redact sensitive data.** Replace real addresses, host names, user names or secrets if they are confidential. Never paste passwords.

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: "`pip show netbox-windows-dhcp-plugin`"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: netbox-version
    attributes:
      label: NetBox version
      description: Shown in the NetBox UI footer.
      placeholder: "v4.7.2"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is NetBox deployed?
      options:
        - netbox-docker
        - Bare metal / VM (systemd)
        - NetBox Cloud / Enterprise
        - Other
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Pages and forms
        - REST API or GraphQL
        - Connection test (WinRM or SSH)
        - Push to Windows
        - Import from Windows
        - Branching or change control
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the URL, what you clicked, the Windows Server version and the objects involved.
      placeholder: |
        1. Open a Windows server and click "Test connection"
        2. Open the sync run
        3. ...
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Actual behavior, including any error message, server traceback or browser console output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: PLUGINS_CONFIG
      description: Optional. Your `netbox_windows_dhcp_plugin` settings, with credentials removed.
      render: python
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release of the plugin, or I noted my version above.
          required: true
